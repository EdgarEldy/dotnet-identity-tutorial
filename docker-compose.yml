services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT}:8080"
    environment:
      # Development on purpose even though this runs in a container: it keeps Swagger UI
      # reachable when the API is started via docker compose, which is how this tutorial's
      # README tells a reader to try it (http://localhost:8080/swagger), not a production
      # deployment setting.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      Jwt__AccessTokenMinutes: "${JWT_ACCESS_TOKEN_MINUTES}"
      Jwt__RefreshTokenDays: "${JWT_REFRESH_TOKEN_DAYS}"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN}"
    networks:
      - pg_net

networks:
  # Reuses the already-running shared "postgres_main" Postgres container
  # instead of spinning up a dedicated Postgres service.
  pg_net:
    external: true
