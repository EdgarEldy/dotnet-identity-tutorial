name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DotnetIdentityTutorial.slnx

      - name: Build
        run: dotnet build DotnetIdentityTutorial.slnx --no-restore --configuration Release

      # No services: postgres block. Testcontainers starts and tears down its
      # own PostgreSQL container per test class via the Docker daemon already
      # available on ubuntu-latest, so test needs nothing pre-provisioned.
      - name: Test
        run: dotnet test DotnetIdentityTutorial.slnx --no-build --configuration Release
